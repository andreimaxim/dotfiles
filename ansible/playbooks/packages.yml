---
- name: Install packages (reboot required after)
  hosts: localhost
  connection: local

  tasks:
    # ===================
    # Core packages
    # ===================
    - name: Install core packages
      become: true
      community.general.rpm_ostree_pkg:
        name:
          - git
          - stow
          - vim-enhanced
          - tree
          - unzip
          - bash-completion
          - emacs
          - gnuplot
        state: present

    # ===================
    # Build tools
    # ===================
    - name: Install build tools
      become: true
      community.general.rpm_ostree_pkg:
        name:
          - gcc
          - gcc-c++
          - make
          - clang
          - autoconf
          - bison
          - pkg-config
        state: present

    # ===================
    # Dev libraries
    # ===================
    - name: Install development libraries
      become: true
      community.general.rpm_ostree_pkg:
        name:
          - openssl-devel
          - readline-devel
          - zlib-devel
          - libyaml-devel
          - libffi-devel
          - gdbm-devel
          - ncurses-devel
          - vips
          - vips-devel
          - ImageMagick
          - ImageMagick-devel
          - postgresql16
          - libpq-devel
          - redis
          - sqlite
          - sqlite-devel
          - mysql-devel
          - webkit2gtk4.1
        state: present

    # ===================
    # CLI tools
    # ===================
    - name: Install CLI tools
      become: true
      community.general.rpm_ostree_pkg:
        name:
          - git-lfs
          - tig
          - fzf
          - fd-find
          - jq
          - gh
          - direnv
          - tmux
          - ShellCheck
          - kubernetes1.35-client
          - bat
          - git-delta
          - eza
          - ripgrep
          - zoxide
          - du-dust
          - procs
          - btop
        state: present

    # ===================
    # Containers
    # ===================
    - name: Install container tools
      become: true
      community.general.rpm_ostree_pkg:
        name:
          - podman
          - podman-docker
          - podman-tui
        state: present

    - name: Enable podman socket for current user
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true
        scope: user

    # ===================
    # 1Password
    # ===================
    - name: Add 1Password repository
      become: true
      copy:
        dest: /etc/yum.repos.d/1password.repo
        content: |
          [1password]
          name=1Password Stable Channel
          baseurl=https://downloads.1password.com/linux/rpm/stable/$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://downloads.1password.com/linux/keys/1password.asc

    - name: Install 1password
      become: true
      community.general.rpm_ostree_pkg:
        name:
          - 1password
          - 1password-cli
        state: present

    # ===================
    # VS Code
    # ===================
    - name: Add Microsoft VSCode repository
      become: true
      copy:
        dest: /etc/yum.repos.d/vscode.repo
        content: |
          [code]
          name=Visual Studio Code
          baseurl=https://packages.microsoft.com/yumrepos/vscode
          enabled=1
          gpgcheck=1
          gpgkey=https://packages.microsoft.com/keys/microsoft.asc

    - name: Install code
      become: true
      community.general.rpm_ostree_pkg:
        name: code
        state: present

    # ===================
    # Google Chrome
    # ===================
    # Installed as RPM (not Flatpak) so 1Password browser integration and
    # other native-messaging hosts work without sandbox workarounds.
    - name: Add Google Chrome repository
      become: true
      copy:
        dest: /etc/yum.repos.d/google-chrome.repo
        content: |
          [google-chrome]
          name=google-chrome
          baseurl=https://dl.google.com/linux/chrome/rpm/stable/x86_64
          enabled=1
          gpgcheck=1
          gpgkey=https://dl.google.com/linux/linux_signing_key.pub

    - name: Install google-chrome-stable
      become: true
      community.general.rpm_ostree_pkg:
        name: google-chrome-stable
        state: present

    # ===================
    # Brave Origin Nightly
    # ===================
    # Origin is the privacy-focused build of Brave (no ads, no rewards,
    # no Web3/crypto features). Only available on the nightly channel.
    - name: Add Brave Browser Nightly repository
      become: true
      ansible.builtin.get_url:
        url: https://brave-browser-rpm-nightly.s3.brave.com/brave-browser-nightly.repo
        dest: /etc/yum.repos.d/brave-browser-nightly.repo
        mode: '0644'

    - name: Install brave-origin-nightly
      become: true
      community.general.rpm_ostree_pkg:
        name: brave-origin-nightly
        state: present

    # ===================
    # Starship
    # ===================
    # Not in Fedora repos; installed from the maintainer-recommended COPR.
    - name: Add Starship COPR repository
      become: true
      ansible.builtin.get_url:
        url: https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-$releasever/atim-starship-fedora.repo
        dest: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:atim:starship.repo
        mode: '0644'

    - name: Install starship
      become: true
      community.general.rpm_ostree_pkg:
        name: starship
        state: present

    - name: Notify about reboot
      debug:
        msg: "Packages installed. Please reboot, then run: ansible-playbook playbooks/tools.yml"
