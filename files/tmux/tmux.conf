# Keep C-Space available to Neovim; Windows Terminal passes C-a through.
set -g prefix C-a
set -g prefix2 C-b
unbind C-Space
bind -N "Send prefix" C-a send-prefix

# Configuration and copy mode.
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send-keys -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Panes and windows stay in the current working directory.
unbind '"'
unbind %
bind -N "Split pane top/bottom" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane left/right" | split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"

# Prefix-based navigation avoids Windows and Windows Terminal shortcuts.
bind -N "Select pane left" h select-pane -L
bind -N "Select pane down" j select-pane -D
bind -N "Select pane up" k select-pane -U
bind -N "Select pane right" l select-pane -R
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# Modern terminal and Amp compatibility.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-features ",*:hyperlinks"
set -ga terminal-features ",*:clipboard"
set -ga terminal-features ",xterm*:sync"
set -g allow-passthrough on
set -g focus-events on
set -s set-clipboard on
set -s extended-keys on
set -g extended-keys-format csi-u
bind -n S-Enter send-keys -l "\e[13;2u"

# Session behavior.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g detach-on-destroy off
setw -g aggressive-resize on

# Compact, informative status without plugins.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#S:#W'
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=colour16,bg=colour12,bold] #S #[bg=default] "
set -g status-right "#[fg=colour12]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=colour8]#h "
set -g window-status-format "#[fg=colour8] #I:#W "
set -g window-status-current-format "#[fg=colour12,bold] #I:#W "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour12"
set -g message-style "bg=default,fg=colour12"
set -g mode-style "bg=colour12,fg=colour16"
