min_version = "2026.7.12"

[settings]
idiomatic_version_file_enable_tools = ["ruby"]
env_file = ".env"
lockfile = true

[settings.npm]
package_manager = "npm"

[settings.status]
show_env = true
show_tools = false
truncate = false

[tools]
node = "24"
rust = "stable"
neovim = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
delta = "latest"
lazygit = "latest"
starship = "latest"
zoxide = "latest"
github-cli = "latest"
actionlint = "latest"
tokei = "latest"
tree-sitter = "latest"
tmux = "3.7b"
"github:quarylabs/sqruff" = { version = "latest", asset_pattern = "sqruff-linux-x86_64-musl.tar.gz" }
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:hunkdiff" = "latest"
"npm:ccusage" = "latest"
"npm:@andreimaxim/git-xor" = "latest"
"npm:@herb-tools/language-server" = "latest"
"github:solarwinds/swo-cli" = { version = "latest", asset_pattern = "swo-cli_linux_amd64.zip" }

[bootstrap.packages]
"apt:git" = "latest"
"apt:git-lfs" = "latest"
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:clang" = "latest"
"apt:autoconf" = "latest"
"apt:bison" = "latest"
"apt:jq" = "latest"
"apt:btop" = "latest"
"apt:tig" = "latest"
"apt:docker.io" = "latest"
"apt:docker-compose-v2" = "latest"
"apt:postgresql-client" = "latest"
"apt:redis-tools" = "latest"
"apt:libssl-dev" = "latest"
"apt:libyaml-dev" = "latest"
"apt:libreadline-dev" = "latest"
"apt:zlib1g-dev" = "latest"
"apt:libffi-dev" = "latest"
"apt:libgmp-dev" = "latest"
"apt:libgdbm-dev" = "latest"
"apt:libdb-dev" = "latest"
"apt:liblzma-dev" = "latest"
"apt:uuid-dev" = "latest"
"apt:libpq-dev" = "latest"
"apt:libsqlite3-dev" = "latest"
"apt:sqlite3" = "latest"
"apt:libvips-dev" = "latest"
"apt:imagemagick" = "latest"
"apt:ffmpeg" = "latest"
"apt:poppler-utils" = "latest"
"apt:luarocks" = "latest"
"apt:unzip" = "latest"
"apt:procps" = "latest"
"apt:bubblewrap" = "latest"
"apt:socat" = "latest"
"apt:less" = "latest"

[dotfiles]
"~/.bashrc" = { source = "files/bash/bashrc", mode = "symlink" }
"~/.bash_profile" = { source = "files/bash/profile", mode = "symlink" }
"~/.profile" = { source = "files/bash/profile", mode = "symlink" }
"~/.inputrc" = { source = "files/bash/inputrc", mode = "symlink" }
"~/.npmrc" = { source = "files/npm/npmrc", mode = "symlink" }
"~/.default-gems" = { source = "files/ruby/default-gems", mode = "symlink" }
"~/.config/bat/config" = { source = "files/bat/config", mode = "symlink" }
"~/.config/btop/btop.conf" = { source = "files/btop/btop.conf", mode = "symlink" }
"~/.config/btop/themes/catppuccin_mocha.theme" = { source = "files/btop/catppuccin_mocha.theme", mode = "symlink" }
"~/.config/eza/theme.yml" = { source = "files/eza/theme.yml", mode = "symlink" }
"~/.config/git/config" = { source = "files/git/config", mode = "symlink" }
"~/.config/git/ignore" = { source = "files/git/ignore", mode = "symlink" }
"~/.config/git/allowed_signers" = { source = "files/git/allowed_signers", mode = "symlink" }
"~/.config/hunk/config.toml" = { source = "files/hunk/config.toml", mode = "symlink" }
"~/.config/lazygit/config.yml" = { source = "files/lazygit/config.yml", mode = "symlink" }
"~/.config/sqruff/.sqruff" = { source = "files/sqruff/sqruff", mode = "symlink" }
"~/.config/tig/config" = { source = "files/tig/config", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = "files/tmux/tmux.conf", mode = "symlink" }
"~/.config/nvim" = { source = "files/nvim", mode = "symlink-each" }
"~/.local/bin/onepassword-ssh" = { source = "files/bin/onepassword-ssh", mode = "symlink" }
"~/.local/bin/onepassword-ssh-sign" = { source = "files/bin/onepassword-ssh-sign", mode = "symlink" }
"~/.local/bin/mise-project-exec" = { source = "files/bin/mise-project-exec", mode = "symlink" }
"~/.claude/settings.json" = { source = "files/claude/settings.json", mode = "symlink" }
"~/.claude/SYSTEM.md" = { source = "files/claude/SYSTEM.md", mode = "symlink" }
"~/.agents/skills" = { source = "files/agents/skills", mode = "symlink-each" }
"~/.claude/skills" = { source = "files/agents/skills", mode = "symlink-each" }

[tasks.bootstrap]
description = "Install WSL clipboard support and run database containers"
run = '''
set -eu

if ! dpkg-query -W -f='${Status}' wl-clipboard 2>/dev/null | grep -Fxq 'install ok installed'; then
  sudo apt-get install -y --no-install-recommends wl-clipboard
fi

remove_legacy_nix_link() {
  path=$1
  [ -L "$path" ] || return 0
  target=$(readlink "$path")
  case "$target" in
    /nix/store/*) rm -- "$path" ;;
  esac
}

# Remove files previously deployed by Home Manager but intentionally absent
# from the mise setup. Only /nix/store symlinks and empty legacy directories
# are removed.
for path in \
  "$HOME/.agents/skills/domain-language/references/examples.md" \
  "$HOME/.agents/skills/domain-language/SKILL.md" \
  "$HOME/.agents/skills/nixify-project/SKILL.md" \
  "$HOME/.agents/skills/shape/SKILL.md" \
  "$HOME/.claude/skills/domain-language/references/examples.md" \
  "$HOME/.claude/skills/domain-language/SKILL.md" \
  "$HOME/.claude/skills/nixify-project/SKILL.md" \
  "$HOME/.claude/skills/shape/SKILL.md" \
  "$HOME/.config/containers/containers.conf" \
  "$HOME/.config/containers/systemd/memcached.container" \
  "$HOME/.config/containers/systemd/mysql57.container" \
  "$HOME/.config/containers/systemd/postgres16.container" \
  "$HOME/.config/containers/systemd/redis.container" \
  "$HOME/.config/direnv/direnv.toml" \
  "$HOME/.config/direnv/lib/hm-nix-direnv.sh" \
  "$HOME/.config/environment.d/10-home-manager.conf" \
  "$HOME/.config/systemd/user/podman-user-wait-network-online.service.d/override.conf" \
  "$HOME/.config/systemd/user/tray.target" \
  "$HOME/.config/wezterm/wezterm.lua" \
  "$HOME/.config/zed/settings.json"
do
  remove_legacy_nix_link "$path"
done

for path in \
  "$HOME/.agents/skills/domain-language/references" \
  "$HOME/.agents/skills/domain-language" \
  "$HOME/.agents/skills/shape" \
  "$HOME/.claude/skills/domain-language/references" \
  "$HOME/.claude/skills/domain-language" \
  "$HOME/.claude/skills/shape"
do
  rmdir -- "$path" 2>/dev/null || true
done

if [ "$(cat /proc/1/comm 2>/dev/null || true)" != systemd ]; then
  cat >&2 <<'EOF'
WSL systemd is required. Add this to /etc/wsl.conf:

[boot]
systemd=true

Then run `wsl.exe --shutdown` from Windows and reopen Ubuntu.
EOF
  exit 1
fi

sudo systemctl enable --now docker.service
if ! id -nG "$USER" | tr ' ' '\n' | grep -Fxq docker; then
  sudo usermod -aG docker "$USER"
fi

if ! sudo docker container inspect postgres16 >/dev/null 2>&1; then
  sudo docker run --detach \
    --restart always \
    --name postgres16 \
    --env POSTGRES_HOST_AUTH_METHOD=trust \
    --env POSTGRES_USER="$USER" \
    --volume postgres16-data:/var/lib/postgresql/data \
    --publish 127.0.0.1:5432:5432 \
    --shm-size 1g \
    docker.io/library/postgres@sha256:972eeb4e0a5fee4c3046cf868896719227e845aa9e38ff79a353efb3b2b2c10a \
    -c max_locks_per_transaction=1024 \
    -c maintenance_work_mem=1GB \
    -c autovacuum_work_mem=256MB \
    -c max_parallel_maintenance_workers=4 \
    -c max_wal_size=16GB \
    -c checkpoint_timeout=30min \
    -c wal_compression=lz4
fi

if ! sudo docker container inspect redis >/dev/null 2>&1; then
  sudo docker run --detach \
    --restart always \
    --name redis \
    --volume redis-data:/data \
    --publish 127.0.0.1:6379:6379 \
    docker.io/library/redis@sha256:0908d9af26bf9b985e984a40a5eb82eed229b07a3317eee6843832c3cc3a9619
fi
'''
